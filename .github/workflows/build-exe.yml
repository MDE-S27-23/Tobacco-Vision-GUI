# Builds the Windows .exe on GitHub and attaches it to the release of a tag

name: Build exe

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      # Same command as build_exe.bat
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TobaccoVisionGUI --collect-all tkinterdnd2 main.py

      # Test builds
      - name: Keep the exe from a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TobaccoVisionGUI-test-build
          path: dist/TobaccoVisionGUI.exe

      # Tag builds
      - name: Attach to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          exe="dist/TobaccoVisionGUI-$TAG.exe"
          mv dist/TobaccoVisionGUI.exe "$exe"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$exe" --clobber
          else
            gh release create "$TAG" "$exe" --title "$TAG" --generate-notes
          fi

  # tell MS Teams about the release
  notify:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg title "TobaccoVisionGUI $TAG is ready" \
            --arg exe  "$REPO_URL/releases/download/$TAG/TobaccoVisionGUI-$TAG.exe" \
            --arg page "$REPO_URL/releases/tag/$TAG" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    { type: "TextBlock", text: $title, weight: "Bolder", size: "Medium", wrap: true }
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "Download exe", url: $exe },
                    { type: "Action.OpenUrl", title: "Release page", url: $page }
                  ]
                }
              }]
            }')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$payload" "$TEAMS_WEBHOOK_URL"
          